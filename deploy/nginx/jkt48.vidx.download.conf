# jkt48.vidx.download — arsip komunitas JKT48 (Next.js di 127.0.0.1:3101)
#
# Pasang di VPS:
#   sudo cp deploy/nginx/jkt48.vidx.download.conf /etc/nginx/sites-available/jkt48.vidx.download
#   sudo ln -s /etc/nginx/sites-available/jkt48.vidx.download /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sertifikat: sudo certbot --nginx -d jkt48.vidx.download
#
# CATATAN: berkas ini BELUM diuji dengan nginx sungguhan (nginx tidak tersedia di
# lingkungan pengembangan proyek ini). Uji dengan `nginx -t` sebelum reload.

server {
    listen 80;
    listen [::]:80;
    server_name jkt48.vidx.download;

    #  JANGAN set SSL/TLS mode Cloudflare ke "Flexible".
    # Blok ini mengalihkan semua HTTP ke HTTPS. Dengan mode Flexible, Cloudflare
    # menghubungi origin lewat HTTP, menerima 301 ini, lalu mengulanginya tanpa
    # henti → browser melaporkan ERR_TOO_MANY_REDIRECTS dan situs tidak bisa dibuka.
    # Gunakan "Full (strict)" (lihat deploy/README.md).

    # Penerbitan/perpanjangan sertifikat Let's Encrypt lewat HTTP.
    # Dikecualikan dari redirect di atas agar certbot tetap bisa memverifikasi.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx >= 1.25.1. Versi lama: ganti menjadi "listen 443 ssl http2;"
    server_name jkt48.vidx.download;

    ssl_certificate     /etc/letsencrypt/live/jkt48.vidx.download/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jkt48.vidx.download/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Aplikasi memakai cookie Secure; HSTS menutup celah downgrade ke HTTP.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Website tidak menerima unggahan berkas; batasi agar tidak jadi vektor DoS.
    client_max_body_size 1m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Aset Next.js ber-hash: aman di-cache sangat lama.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;

        # WAJIB. Pemeriksaan origin login di web/lib/auth.ts membandingkan header
        # Origin dengan APP_ORIGIN, jadi skema dan host harus diteruskan apa adanya.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # Koneksi jangka panjang (streaming SSR Next.js).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Jangan menahan respons: Next.js mengalirkan HTML secara bertahap.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
